        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .course-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-left-width: 5px;
        }

        .course-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .semester-column {
            min-width: 320px;
            position: relative;
        }

        .semester-column:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 0;
            right: -20px;
            height: 100%;
            width: 1px;
            border-right: 2px dashed #cbd5e1;
            opacity: 0.6;
        }

        .segmented-btn.active {
            background: #0f172a;
            color: white;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.15);
        }

        .segmented-btn {
            transition: all 0.2s ease;
        }
    </style>

        };

        const board = document.getElementById('board');
        const emptyState = document.getElementById('empty-state');
        const levelSwitch = document.getElementById('level-switch');
        const trackSwitch = document.getElementById('track-switch');
        const modal = document.getElementById('course-modal');
        const modalContent = document.getElementById('modal-content-wrapper');

        function prettifyText(text) {
            return (text || '').replace(/\s+/g, ' ').trim();
        }

        function inferCategoryByTitle(courseOrTitle) {
            const rawTitle = typeof courseOrTitle === 'string' ? courseOrTitle : ((courseOrTitle && courseOrTitle.title) || '');
            const title = prettifyText(rawTitle).toLowerCase();

            const researchTitles = ['академическое письмо', 'научный семинар', 'математика больших данных'];
            const baseTitles = ['статистическая теория машинного обучения', 'матричный анализ и вычислительная алгебра', 'теория оптимизации', 'основы обучения с подкреплением', 'прикладная статистика', 'теория эксперимента', 'методология эксперимента'];
            const modernTitles = ['логика, дискретные алгоритмы и ml', 'теория функций и архитектуры в ии', 'методы оптимизации в задачах машинного обучения', 'геометрические методы в глубоком обучении', 'теория информации: приложения к ии', 'рандомизированные алгоритмы линейной алгебры', 'выразительность трансформеров'];
            const applicationTitles = ['современное компьютерное зрение', 'анализ временных рядов', 'mlops', 'внедрение и поддержка приложений на основе машинного обучения', 'рекомендательные системы', 'альтернативные архитектуры и методы', 'агенты:', 'фундаментальные модели для структурированных данных', 'эффективные системы глубинного обучения', 'масштабирование больших языковых моделей', 'ии для роботов', 'доверенный искусственный интеллект', 'графовые нейронные сети'];

            if (researchTitles.some(item => title.includes(item))) return 'research';
            if (baseTitles.some(item => title.includes(item))) return 'base';
            if (modernTitles.some(item => title.includes(item))) return 'modern';
            if (applicationTitles.some(item => title.includes(item))) return 'applications';
            return 'applications';
        }

        function getTheme(categoryKey) {
            return categoryThemes[categoryKey] || categoryThemes.applications;
        }

        function getChoiceGroupMeta(options) {
            const categories = [...new Set((options || []).map(option => inferCategoryByTitle(option)))];
            return {
                categories,
                isMixed: categories.length > 1,
                primaryCategory: categories[0] || 'applications'
            };
        }

        function createSegmentedButtons(container, options, currentValue, onClick) {
            container.innerHTML = '';
            options.forEach(([value, label]) => {
                const button = document.createElement('button');
                button.className = `segmented-btn px-3 py-1.5 rounded-xl text-xs font-semibold ${value === currentValue ? 'active' : 'text-slate-600 hover:text-slate-900'}`;
                button.textContent = label;
                button.addEventListener('click', () => onClick(value));
                container.appendChild(button);
            });
        }

        function createCourseCard(course) {
            const resolvedCategory = course.resolvedCategory || inferCategoryByTitle(course);
            const theme = getTheme(resolvedCategory);
            const isBachelor = state.level === 'бакалавриат';
            const isMaster = state.level === 'магистратура';
            const showStatusBadge = !isMaster && !(isBachelor && course.status === 'обязательный');
            const showDepartment = !isMaster;
            const choiceMeta = course.isChoiceGroup ? getChoiceGroupMeta(course.options) : null;
            const isMixedChoice = Boolean(choiceMeta && choiceMeta.isMixed);
            const card = document.createElement('div');

            if (isMixedChoice) {
                const colorMap = { base: '#3b82f6', modern: '#10b981', applications: '#8b5cf6', research: '#f43f5e' };
                const colorA = colorMap[choiceMeta.categories[0]] || colorMap.applications;
                const colorB = colorMap[choiceMeta.categories[1]] || colorMap.applications;
                card.className = 'bg-white border border-slate-200 course-card rounded-2xl p-5 cursor-pointer flex flex-col gap-3 shadow-sm hover:border-slate-300 relative overflow-hidden';
                card.style.borderLeftWidth = '0px';
                card.style.backgroundImage = `linear-gradient(to right, ${colorA} 0px, ${colorA} 5px, ${colorB} 5px, ${colorB} 10px, #ffffff 10px, #ffffff 100%)`;
            } else {
                card.className = `${theme.bg} ${theme.border} border course-card rounded-2xl p-5 cursor-pointer flex flex-col gap-3 shadow-sm hover:border-slate-300`;
            }

            card.dataset.full = JSON.stringify({ ...course, resolvedCategory, level: state.level, track: state.track });

            const choiceHint = course.isChoiceGroup
                ? `<div class="rounded-xl ${isMixedChoice ? 'bg-slate-50 border-slate-200' : 'bg-white/70 border-slate-200'} border px-3 py-2 text-[11px] leading-relaxed text-slate-600">
                        <ul class="space-y-2">
                            ${(course.options || []).map(option => {
                                const optionCategory = inferCategoryByTitle(option);
                                const dotClass = getTheme(optionCategory).border.replace('border-', 'bg-');
                                return `<li class="flex items-start gap-2"><span class="w-2 h-2 rounded-full mt-1.5 shrink-0 ${dotClass}"></span><span>${option.title}</span></li>`;
                            }).join('')}
                        </ul>
                   </div>`
                : '';

            const departmentHtml = showDepartment
                ? `<div class="space-y-2 border-t border-slate-200/60 pt-4">
                        <div class="flex items-start gap-2 text-[11px] text-slate-500 font-semibold leading-relaxed">
                            <i data-lucide="building-2" class="w-3.5 h-3.5 text-slate-400 shrink-0 mt-0.5"></i>
                            <span>${course.department}</span>
                        </div>
                   </div>`
                : '';

            card.innerHTML = `
                <div class="flex items-start justify-between gap-3">
                    <h4 class="font-bold text-slate-800 text-[16px] leading-tight">${course.title}</h4>
                    ${showStatusBadge ? `<span class="shrink-0 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wide ${theme.badge}">${course.status}</span>` : ''}
                </div>
                ${choiceHint}
                ${departmentHtml}
            `;
            card.addEventListener('click', openModal);
            return card;
        }

        function normalizeSemesterCourses(courses) {
            if (state.level !== 'магистратура') {
                return courses.map(course => ({ ...course, resolvedCategory: inferCategoryByTitle(course) }));
            }

            const normalized = [];
            for (let i = 0; i < courses.length; i++) {
                const current = courses[i];
                const isChoiceBlock = prettifyText(current.title).toLowerCase().includes('блок по выбору');

                if (isChoiceBlock) {
                    const option1 = courses[i + 1];
                    const option2 = courses[i + 2];
                    if (option1 && option2) {
                        normalized.push({
                            title: current.title,
                            status: 'по выбору',
                            department: 'Выберите одну из двух дисциплин',
                            format: '1 дисциплина на выбор',
                            rup: '#',
                            isChoiceGroup: true,
                            options: [option1, option2],
                            resolvedCategory: inferCategoryByTitle(option1)
                        });
                        i += 2;
                        continue;
                    }
                }

                normalized.push({ ...current, resolvedCategory: inferCategoryByTitle(current) });
            }
            return normalized;
        }

        function renderBoard() {
            const semesters = curriculumData[state.level]?.[state.track] || [];
            board.innerHTML = '';

            document.getElementById('page-title').textContent = `${levelLabels[state.level]}: ${trackLabels[state.track]} трек`;

            if (!semesters.length) {
                emptyState.classList.remove('hidden');
                lucide.createIcons();
                return;
            }

            emptyState.classList.add('hidden');

            semesters.forEach((sem) => {
                const column = document.createElement('div');
                column.className = 'semester-column flex flex-col h-auto';

                const header = document.createElement('div');
                header.className = 'mb-5 px-1 flex flex-col gap-1';
                header.innerHTML = `
                    <h3 class="text-2xl font-black text-slate-900">${sem.title}</h3>
                    <div class="h-1.5 w-12 bg-slate-900 rounded-full"></div>
                `;
                column.appendChild(header);

                const list = document.createElement('div');
                list.className = 'flex flex-col gap-4';
                normalizeSemesterCourses(sem.courses).forEach(course => list.appendChild(createCourseCard(course)));
                column.appendChild(list);
                board.appendChild(column);
            });

            lucide.createIcons();
        }

        function renderSwitches() {
            createSegmentedButtons(levelSwitch, Object.entries(levelLabels), state.level, (value) => {
                state.level = value;
                renderSwitches();
                renderBoard();
            });

            createSegmentedButtons(trackSwitch, Object.entries(trackLabels), state.track, (value) => {
                state.track = value;
                renderSwitches();
                renderBoard();
            });
        }

        function openModal(e) {
            const card = e.currentTarget;
            const data = JSON.parse(card.dataset.full);
            const theme = getTheme(data.resolvedCategory || inferCategoryByTitle(data));

            document.getElementById('modal-title').textContent = prettifyText(data.title);
            document.getElementById('modal-type-badge').textContent = data.isChoiceGroup ? 'Дисциплина по выбору' : theme.label;
            document.getElementById('modal-type-badge').className = `px-2.5 py-1 rounded text-[10px] font-bold uppercase tracking-widest ${theme.badge}`;
            document.getElementById('modal-level-track').textContent = `${levelLabels[data.level]} • ${trackLabels[data.track]}`;
            document.getElementById('modal-department').textContent = prettifyText(data.department) || '—';

            const prettyStatus = prettifyText(data.status);
            const prettyFormat = prettifyText(data.format) || 'уточняется';
            const hideBachelorStatus = data.level === 'бакалавриат' && prettyStatus === 'обязательный';
            const hideMasterStatus = data.level === 'магистратура';
            document.getElementById('modal-status-format').textContent = (hideBachelorStatus || hideMasterStatus)
                ? prettyFormat
                : `${prettyStatus.charAt(0).toUpperCase() + prettyStatus.slice(1)} • ${prettyFormat}`;

            const optionsBlock = document.getElementById('modal-options-block');
            const optionsList = document.getElementById('modal-options-list');
            const modalLink = document.getElementById('modal-link');

            if (data.isChoiceGroup && Array.isArray(data.options) && data.options.length) {
                optionsBlock.classList.remove('hidden');
                optionsList.innerHTML = data.options.map((option, index) => {
                    const optionCategory = inferCategoryByTitle(option);
                    const dotClass = getTheme(optionCategory).border.replace('border-', 'bg-');
                    return `
                        <div class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2">
                            <div class="text-[10px] font-bold uppercase tracking-wide text-slate-400 mb-1">Вариант ${index + 1}</div>
                            <div class="flex items-start gap-2">
                                <span class="w-2.5 h-2.5 rounded-full mt-1.5 shrink-0 ${dotClass}"></span>
                                <div>
                                    <div class="text-sm font-semibold text-slate-800">${option.title}</div>
                                    <div class="text-xs text-slate-500 mt-1">${option.department || '—'}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                modalLink.classList.add('hidden');
            } else {
                optionsBlock.classList.add('hidden');
                optionsList.innerHTML = '';
                modalLink.href = data.rup || '#';
                if (!data.rup || data.rup === '#') {
                    modalLink.classList.add('hidden');
                } else {
                    modalLink.classList.remove('hidden');
                }
            }

            lucide.createIcons();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModalLogic() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function runDebugChecks() {
            const sampleTitles = [
                'Матричный анализ и вычислительная алгебра',
                'Теория функций и архитектуры в ИИ',
                'Рекомендательные системы',
                'Академическое письмо'
            ];

            sampleTitles.forEach(title => {
                const key = inferCategoryByTitle(title);
                if (!categoryThemes[key]) {
                    console.error('Не найдена тема для курса:', title, key);
                }
            });
        }

        document.getElementById('close-modal').addEventListener('click', closeModalLogic);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModalLogic();
        });

        window.addEventListener('DOMContentLoaded', () => {
            runDebugChecks();
            renderSwitches();
            renderBoard();
            lucide.createIcons();
        });
    </script>
</body>
</html>
