    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .course-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-left-width: 5px;
        }

        .course-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .semester-column {
            min-width: 320px;
            position: relative;
        }

        .semester-column:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 0;
            right: -20px;
            height: 100%;
            width: 1px;
            border-right: 2px dashed #cbd5e1;
            opacity: 0.6;
        }

        .segmented-btn.active {
            background: #0f172a;
            color: white;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.15);
        }

        .segmented-btn {
            transition: all 0.2s ease;
        }

        .block-card {
            border-left-width: 5px;
        }
    </style>
</head>

                            { "title": "Геометрические методы в глубоком обучении (воркшоп)", "category": "workshop", "status": "обязательный", "department": "Кафедра математики искусственного интеллекта", "format": "уточняется", "rup": "#" },
                            { "title": "Агенты: обучение, мультиагентные системы, ризонинг, автономия (воркшоп)", "category": "workshop", "status": "обязательный", "department": "Кафедра математики искусственного интеллекта", "format": "уточняется", "rup": "#" },
                            { "title": "MLOps. Внедрение и поддержка приложений на основе машинного обучения", "category": "cs", "status": "обязательный", "department": "Кафедра математики искусственного интеллекта", "format": "уточняется", "rup": "#" },
                            { "title": "Матричный анализ и вычислительная алгебра", "category": "math", "status": "обязательный", "department": "Кафедра математических основ управления", "format": "уточняется", "rup": "#" }
                        ]
                    },
                    {
                        "semester": 11,
                        "title": "11 Семестр",
                        "courses": [
                            { "title": "Альтернативные архитектуры и методы в ИИ (воркшоп)", "category": "workshop", "status": "обязательный", "department": "Кафедра математики искусственного интеллекта", "format": "уточняется", "rup": "#" },
                            { "title": "Масштабирование больших языковых моделей", "category": "cs", "status": "обязательный", "department": "Кафедра анализа данных", "format": "уточняется", "rup": "#" },
                            { "title": "Доверенный искусственный интеллект", "category": "ml", "status": "обязательный", "department": "Кафедра математики искусственного интеллекта", "format": "уточняется", "rup": "#" }
                        ]
                    }
                ]
            }
        };

        const levelLabels = {
            "бакалавриат": "Бакалавриат",
            "магистратура": "Магистратура"
        };

        const trackLabels = {
            "теоретический": "Теоретический",
            "практический": "Практический"
        };

        const state = {
            level: 'бакалавриат',
            track: 'теоретический'
        };

        const board = document.getElementById('board');
        const emptyState = document.getElementById('empty-state');
        const levelSwitch = document.getElementById('level-switch');
        const trackSwitch = document.getElementById('track-switch');

        function prettifyText(text) {
            return (text || '').replace(/\s+/g, ' ').trim();
        }

        function createSegmentedButtons(container, options, currentValue, onClick) {
            container.innerHTML = '';
            options.forEach(([value, label]) => {
                const button = document.createElement('button');
                button.className = `segmented-btn px-3 py-1.5 rounded-xl text-xs font-semibold ${value === currentValue ? 'active' : 'text-slate-600 hover:text-slate-900'}`;
                button.textContent = label;
                button.addEventListener('click', () => onClick(value));
                container.appendChild(button);
            });
        }

        function createCourseCard(course) {
            const theme = categoryThemes[course.category] || categoryThemes.ml;
            const isBachelor = state.level === 'бакалавриат';
            const isMaster = state.level === 'магистратура';
            const showStatusBadge = !isMaster && !(isBachelor && course.status === 'обязательный');
            const showDepartment = !isMaster;
            const card = document.createElement('div');
            card.className = `bg-white border border-slate-200 ${theme.border} ${theme.bg} course-card rounded-2xl p-5 cursor-pointer flex flex-col gap-3 shadow-sm hover:border-slate-300`;
            card.dataset.full = JSON.stringify({ ...course, level: state.level, track: state.track });

            const choiceHint = course.isChoiceGroup
                ? `<div class="rounded-xl bg-white/70 border border-slate-200 px-3 py-2 text-[11px] leading-relaxed text-slate-600">
                        <ul class="list-disc pl-4 space-y-1">
                            ${(course.options || []).map(option => `<li>${option.title}</li>`).join('')}
                        </ul>
                   </div>`
                : '';

            const departmentHtml = showDepartment
                ? `<div class="space-y-2 border-t border-slate-200/60 pt-4">
                        <div class="flex items-start gap-2 text-[11px] text-slate-500 font-semibold leading-relaxed">
                            <i data-lucide="building-2" class="w-3.5 h-3.5 text-slate-400 shrink-0 mt-0.5"></i>
                            <span>${course.department}</span>
                        </div>
                   </div>`
                : '';

            card.innerHTML = `
                <div class="flex items-start justify-between gap-3">
                    <h4 class="font-bold text-slate-800 text-[16px] leading-tight">${course.title}</h4>
                    ${showStatusBadge ? `<span class="shrink-0 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wide ${theme.badge}">${course.status}</span>` : ''}
                </div>
                ${choiceHint}
                ${departmentHtml}
            `;
            card.addEventListener('click', openModal);
            return card;
        }

        function normalizeSemesterCourses(courses) {
            if (state.level !== 'магистратура') return courses;

            const normalized = [];
            for (let i = 0; i < courses.length; i++) {
                const current = courses[i];
                const isChoiceBlock = current.title.toLowerCase().includes('блок по выбору');

                if (isChoiceBlock) {
                    const option1 = courses[i + 1];
                    const option2 = courses[i + 2];

                    if (option1 && option2) {
                        normalized.push({
                            title: current.title,
                            category: (option1.category || option2.category || 'ml'),
                            status: 'по выбору',
                            department: 'Выберите одну из двух дисциплин',
                            format: '1 дисциплина на выбор',
                            rup: '#',
                            isChoiceGroup: true,
                            options: [option1, option2]
                        });
                        i += 2;
                        continue;
                    }
                }

                normalized.push(current);
            }

            return normalized;
        }

        function renderBoard() {
            const semesters = curriculumData[state.level]?.[state.track] || [];
            board.innerHTML = '';

            document.getElementById('page-title').textContent = `${levelLabels[state.level]}: ${trackLabels[state.track]} трек`;
            document.getElementById('page-subtitle').textContent = `Предметы загружены из учебного файла для направления «${trackLabels[state.track].toLowerCase()}»`;

            if (!semesters.length) {
                emptyState.classList.remove('hidden');
                lucide.createIcons();
                return;
            }

            emptyState.classList.add('hidden');

            semesters.forEach((sem) => {
                const column = document.createElement('div');
                column.className = 'semester-column flex flex-col h-auto';

                const header = document.createElement('div');
                header.className = 'mb-5 px-1 flex flex-col gap-1';
                header.innerHTML = `
                    <h3 class="text-2xl font-black text-slate-900">${sem.title}</h3>
                    <div class="h-1.5 w-12 bg-slate-900 rounded-full"></div>
                `;
                column.appendChild(header);

                const list = document.createElement('div');
                list.className = 'flex flex-col gap-4';
                const normalizedCourses = normalizeSemesterCourses(sem.courses);
                normalizedCourses.forEach(course => list.appendChild(createCourseCard(course)));
                column.appendChild(list);
                board.appendChild(column);
            });

            lucide.createIcons();
        }

        function renderSwitches() {
            createSegmentedButtons(levelSwitch, Object.entries(levelLabels), state.level, (value) => {
                state.level = value;
                renderSwitches();
                renderBoard();
            });

            createSegmentedButtons(trackSwitch, Object.entries(trackLabels), state.track, (value) => {
                state.track = value;
                renderSwitches();
                renderBoard();
            });
        }

        const modal = document.getElementById('course-modal');
        const modalContent = document.getElementById('modal-content-wrapper');

        function openModal(e) {
            const card = e.currentTarget;
            const data = JSON.parse(card.dataset.full);
            const theme = categoryThemes[data.category] || categoryThemes.ml;

            document.getElementById('modal-title').textContent = prettifyText(data.title);
            document.getElementById('modal-type-badge').textContent = data.isChoiceGroup ? 'Дисциплина по выбору' : theme.label;
            document.getElementById('modal-type-badge').className = `px-2.5 py-1 rounded text-[10px] font-bold uppercase tracking-widest ${theme.badge}`;
            document.getElementById('modal-level-track').textContent = `${levelLabels[data.level]} • ${trackLabels[data.track]}`;
            document.getElementById('modal-department').textContent = prettifyText(data.department) || '—';
            const prettyStatus = prettifyText(data.status);
            const prettyFormat = prettifyText(data.format) || 'уточняется';
            const hideBachelorStatus = data.level === 'бакалавриат' && prettyStatus === 'обязательный';
            document.getElementById('modal-status-format').textContent = hideBachelorStatus
                ? prettyFormat
                : `${prettyStatus.charAt(0).toUpperCase() + prettyStatus.slice(1)} • ${prettyFormat}`;
            const optionsBlock = document.getElementById('modal-options-block');
            const optionsList = document.getElementById('modal-options-list');

            if (data.isChoiceGroup && Array.isArray(data.options) && data.options.length) {
                optionsBlock.classList.remove('hidden');
                optionsList.innerHTML = data.options.map((option, index) => `
                    <div class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2">
                        <div class="text-[10px] font-bold uppercase tracking-wide text-slate-400 mb-1">Вариант ${index + 1}</div>
                        <div class="text-sm font-semibold text-slate-800">${option.title}</div>
                        <div class="text-xs text-slate-500 mt-1">${option.department || '—'}</div>
                    </div>
                `).join('');
                document.getElementById('modal-link').classList.add('hidden');
            } else {
                optionsBlock.classList.add('hidden');
                optionsList.innerHTML = '';
                document.getElementById('modal-link').href = data.rup || '#';

                if (!data.rup || data.rup === '#') {
                    document.getElementById('modal-link').classList.add('hidden');
                } else {
                    document.getElementById('modal-link').classList.remove('hidden');
                }
            }

            lucide.createIcons();

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModalLogic() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        document.getElementById('close-modal').addEventListener('click', closeModalLogic);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModalLogic();
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderSwitches();
            renderBoard();
            lucide.createIcons();
        });
    </script>
</body>
</html>
